# Overlay for the second stack on the same VM — /opt/onsys-au.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.au.yml up -d --build
#
# Everything that separates the two stacks is in this file or in the .env beside
# it. Nothing here is reachable from outside the VM.
#
# Deliberately NOT in this file: the edge port. Compose *appends* published
# ports when merging, so adding one here would leave the base file's
# 127.0.0.1:${APP_PORT:-3009}:3009 in place as well, and the second stack would
# try to bind the port the live edge already holds. The port comes from APP_PORT
# in .env instead — see docs/DEPLOY-AU-STACK.md.

services:
  postgres:
    # Pinned here rather than left to DATA_ROOT, because this is the one
    # collision with no recoverable failure mode: two Postgres clusters started
    # against one data directory corrupt it. Compose merges service volumes by
    # target path, so this replaces the base file's mount rather than adding a
    # second one.
    volumes:
      - ${DATA_ROOT_AU:-/opt/data-au}/postgres:/var/lib/postgresql/data

    # The base file publishes nothing, on the argument that HAProxy is on the
    # same host and the database never needs to be reachable. That still holds
    # for the internet; this is loopback only, and it is here because running
    # two clusters on one VM means psql, a migration from the host or a dump
    # has to be able to say *which* one it means.
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT_AU:-5434}:5432'
