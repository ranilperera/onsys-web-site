name: Deploy

# Deploys to the Azure Linux VM over SSH after CI passes on main.
# Required secrets: AZURE_VM_HOST, AZURE_VM_USER, AZURE_VM_SSH_KEY
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/onsys-platform
            git pull --ff-only origin main
            docker compose build
            docker compose run --rm api npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
            docker compose up -d
            docker image prune -f
            # Fail the deploy loudly if the app does not come back healthy.
            sleep 12
            curl -fsS http://localhost:4000/health > /dev/null
            echo "Deploy complete."
