# Edge proxy inside the compose stack.
#
# HAProxy on the VM terminates TLS and forwards plain HTTP to 127.0.0.1:3009.
# This is what listens there. It exists because the platform is two services
# behind one port: the Next.js front end and the Express API, which must share
# an origin so the browser never makes a cross-origin request.
#
# TLS, HTTP->HTTPS redirect and the apex->www redirect all belong to HAProxy.
# Nothing here should duplicate them.

upstream onsys_web { server web:3000; keepalive 32; }
upstream onsys_api { server api:4000; keepalive 32; }

# Second line of defence behind the API's own limiter. Keyed on the forwarded
# client address, not the socket peer — every request here arrives from HAProxy,
# so $binary_remote_addr would put the whole internet in one bucket.
map $http_x_forwarded_for $client_ip {
    ""      $remote_addr;
    default $http_x_forwarded_for;
}
limit_req_zone $client_ip zone=onsys_general:10m rate=30r/s;
limit_req_zone $client_ip zone=onsys_api:10m     rate=10r/s;

# The Connection header sent upstream must be derived, not copied: forwarding
# the client's verbatim would break keepalive on ordinary requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3009;
    server_name _;

    # Uploads and long AI responses.
    client_max_body_size 12M;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # HAProxy has already set X-Forwarded-For and X-Forwarded-Proto. Appending
    # rather than replacing is what lets the API count back two hops to the real
    # client — see TRUST_PROXY_HOPS in .env.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;

    # Compress text responses; images and fonts are already compressed.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml
               application/manifest+json text/xml;

    # Same-origin API. NEXT_PUBLIC_API_URL points at https://host/api, which
    # lands here, so there is no CORS preflight in production at all.
    location /api/ {
        limit_req zone=onsys_api burst=20 nodelay;
        proxy_pass http://onsys_api;
    }

    # Content-hashed build output — safe to cache permanently.
    location /_next/static/ {
        proxy_pass http://onsys_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optimised images are keyed by their query string and are expensive to
    # regenerate, so let the browser hold them for a day.
    location /_next/image {
        proxy_pass http://onsys_web;
        add_header Cache-Control "public, max-age=86400";
    }

    # Lets HAProxy health-check the whole chain rather than just the socket.
    location = /healthz {
        access_log off;
        proxy_pass http://onsys_api/health;
    }

    location / {
        limit_req zone=onsys_general burst=60 nodelay;
        proxy_pass http://onsys_web;
        # Next dev-style HMR is absent in production, but the header costs
        # nothing and keeps any future streaming route working.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }
}
